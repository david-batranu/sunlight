<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#142235" />
    <meta
      name="description"
      content="A low-poly isometric city diorama with real sunlight and moonlight shadows for any date and time."
    />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='7' fill='%23e2a13b'/%3E%3Cg stroke='%23e2a13b' stroke-width='2' stroke-linecap='round'%3E%3Cpath d='M16 2v4M16 26v4M2 16h4M26 16h4M6.1 6.1l2.8 2.8M23.1 23.1l2.8 2.8M25.9 6.1l-2.8 2.8M8.9 23.1l-2.8 2.8'/%3E%3C/g%3E%3C/svg%3E"
    />
    <title>Sunlight — cities in light</title>
  </head>
  <body>
    <a class="skip-link" href="#ui">Skip to city controls</a>
    <main id="main">
    <div id="app">
      <canvas id="scene" tabindex="0" role="application" aria-keyshortcuts="ArrowLeft ArrowRight ArrowUp ArrowDown + -" aria-label="Interactive isometric city diorama with sunlight and shadows" aria-describedby="scene-help"></canvas>
      <p id="scene-help" class="sl-sr-only">
        City diorama. Use the city button to change place, the time console to scrub the
        day, and the Area button to frame or rebuild a smaller square. All controls are
        reachable with the Tab key; Space and Enter activate the focused control.
      </p>
      <div id="ui" tabindex="-1"></div>
      <div id="boot" aria-hidden="true">
        <div class="boot-sun"></div>
        <p>Waking the city…</p>
      </div>
      <noscript>Sunlight needs JavaScript and WebGL2.</noscript>
    </div>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
