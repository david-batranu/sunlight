services:
  sunlight:
    build:
      context: .
      args:
        VITE_BASE: "${VITE_BASE:-./}"
    image: "${SUNLIGHT_IMAGE:-sunlight:local}"
    container_name: sunlight
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 768m
    cpus: 1.5
    tmpfs:
      - /tmp:size=64m
    ports:
      - "127.0.0.1:8090:8090"
    environment:
      PORT: "8090"
      HOST: "0.0.0.0"
      CACHE_DIR: "/data/cache"
      CACHE_MAX_MB: "${CACHE_MAX_MB:-1024}"
      CITY_RADIUS_M: "1500"
      GENERATION_CONCURRENCY: "1"
      CITY_SOURCE: "${CITY_SOURCE:-auto}"
      # Put a real contact URL/address here before exposing the service publicly.
      OSM_USER_AGENT: "${OSM_USER_AGENT:-SunlightCity/0.2 (+https://github.com/david-batranu/sunlight)}"
      RATE_LIMIT_PER_MIN: "${RATE_LIMIT_PER_MIN:-30}"
      READ_RATE_LIMIT_PER_MIN: "${READ_RATE_LIMIT_PER_MIN:-120}"
      SKY_RATE_LIMIT_PER_MIN: "${SKY_RATE_LIMIT_PER_MIN:-60}"
      JOB_QUEUE_MAX: "${JOB_QUEUE_MAX:-8}"
      JOB_PER_CLIENT_MAX: "${JOB_PER_CLIENT_MAX:-2}"
      FAILURE_COOLDOWN_SEC: "${FAILURE_COOLDOWN_SEC:-60}"
      TRUST_PROXY: "${TRUST_PROXY:-0}"
      TRUSTED_PROXY_CIDRS: "${TRUSTED_PROXY_CIDRS:-}"
    volumes:
      - sunlight-cache:/data/cache
    networks:
      - sunlight
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8090/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
        ]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

volumes:
  sunlight-cache:
    name: sunlight-cache

networks:
  sunlight:
    name: sunlight
    driver: bridge
